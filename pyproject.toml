[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "UP", "SIM", "TID"]
ignore = [
    "E501",
    "B008", # FastAPI File/Form defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
